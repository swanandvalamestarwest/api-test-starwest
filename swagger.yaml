openapi: 3.0.3
info:
  title: E-commerce Checkout API
  description: >
    A simple in-memory REST API that allows a consumer to register, login
    (receiving a JWT token), and perform a checkout using cash or credit card.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development server
tags:
  - name: Auth
    description: Registration and login
  - name: Checkout
    description: Checkout operations
  - name: Health
    description: Service health

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Healthcheck
      description: Returns the current status of the API.
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A user with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login and receive a JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/checkout:
    post:
      tags: [Checkout]
      summary: Perform a checkout
      description: >
        Requires a valid JWT token. Only "cash" or "credit_card" are accepted
        as payment methods. Cash payments receive a 10% discount.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: Checkout completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '400':
          description: Invalid checkout request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        uptime:
          type: number
          example: 12.34
        timestamp:
          type: string
          format: date-time

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: John Doe
        email:
          type: string
          example: john.doe@example.com

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Alice Johnson
        email:
          type: string
          example: alice.johnson@example.com
        password:
          type: string
          format: password
          example: strongPassword123

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: john.doe@example.com
        password:
          type: string
          format: password
          example: password123

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/User'

    CheckoutItem:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          example: 1
        quantity:
          type: integer
          example: 2

    CheckoutRequest:
      type: object
      required: [items, paymentMethod]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutItem'
        paymentMethod:
          type: string
          enum: [cash, credit_card]
          example: cash

    CheckoutOrderItem:
      type: object
      properties:
        productId:
          type: integer
        name:
          type: string
        unitPrice:
          type: number
        quantity:
          type: integer
        subtotal:
          type: number

    CheckoutResponse:
      type: object
      properties:
        message:
          type: string
          example: Checkout completed successfully
        buyer:
          $ref: '#/components/schemas/User'
        order:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CheckoutOrderItem'
            paymentMethod:
              type: string
              example: cash
            subtotal:
              type: number
              example: 1029.98
            discount:
              type: number
              example: 102.998
            total:
              type: number
              example: 926.982

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Invalid email or password
