name: API Test Automation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  path-coverage-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Run npm install
        run: npm install

      - name: Run the API in background
        run: nohup npm start > server.log 2>&1 &

      - name: Wait until the API is running
        run: |
          echo "Waiting for the API health check to respond..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "API is up and healthy."
              exit 0
            fi
            echo "API not ready yet, retrying ($i/30)..."
            sleep 2
          done
          echo "API did not become healthy in time."
          cat server.log
          exit 1

      - name: Run test scripts
        run: npm run test:path-coverage

      - name: Upload Mochawesome report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report
          path: mochawesome-report
          if-no-files-found: ignore
